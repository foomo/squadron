version: "2.3"
squadron:
  checkout:
    backend:
      chart:
        name: backend
        repository: file://<% env "PROJECT_ROOT" %>/_examples/common/charts/backend
        version: 0.0.1
      tags:
      - backend
      values:
        image:
          repository: nginx
          tag: latest
    frontend:
      chart:
        name: frontend
        repository: file://<% env "PROJECT_ROOT" %>/_examples/common/charts/frontend
        version: 0.0.1
      tags:
      - frontend
      values:
        image:
          repository: nginx
          tag: latest
  storefinder:
    backend:
      chart:
        name: backend
        repository: file://<% env "PROJECT_ROOT" %>/_examples/common/charts/backend
        version: 0.0.1
      tags:
      - backend
      - skip
      values:
        image:
          repository: nginx
          tag: latest
    frontend:
      chart:
        name: frontend
        repository: file://<% env "PROJECT_ROOT" %>/_examples/common/charts/frontend
        version: 0.0.1
      tags:
      - frontend
      values:
        image:
          repository: nginx
          tag: latest
